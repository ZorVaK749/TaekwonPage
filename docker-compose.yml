services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-taekwonpage}
      POSTGRES_USER: ${DB_USERNAME:-taekwonpage}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: flyway/flyway:11.20.0
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-taekwonpage}
      FLYWAY_USER: ${DB_USERNAME:-taekwonpage}
      FLYWAY_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env}
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./backend/taekwonpage-api/src/main/resources/db/migration:/flyway/sql:ro
    command: migrate

volumes:
  postgres_data:
