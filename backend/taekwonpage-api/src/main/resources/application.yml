server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: taekwonpage-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taekwonpage}}
    username: ${DB_USERNAME:taekwonpage}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    validate-migration-naming: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
taekwonpage:
  security:
    jwt:
      # C1: JWT local autoemitido. No default on purpose: startup fails without it.
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:taekwonpage-local}
      ttl-seconds: ${JWT_TTL_SECONDS:1800}
